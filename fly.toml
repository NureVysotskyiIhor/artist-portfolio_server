[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[http_service.checks]
  [http_service.checks.alive]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/actuator/health"
    timeout = "10s"
